<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E76A1F">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Patrocínio da Feijotacê 2026 — apoie o EJC da Paróquia Nossa Senhora da Conceição Aparecida (Teresina-PI).">

  <title>Feijotacê 2026 · Patrocínio</title>

  <!-- Favicon / PWA -->
  <link rel="icon" type="image/png" href="images/logo-paroquia.png">
  <link rel="apple-touch-icon" href="images/logo-paroquia.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Feijotacê 2026 — Patrocínio">
  <meta property="og:description" content="Seja patrocinador da Feijotacê e apoie o EJC da paróquia.">
  <meta property="og:image" content="images/og-image.jpg">
  <meta property="og:url" content="https://feijotace.pnscaparecida.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --red:        #E76A1F;
      --red-deep:   #A5430D;
      --yellow:     #F4A623;
      --yellow-soft:#F9C65A;
      --beige:      #FBEFDD;
      --cream:      #FFF6E9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--beige);
      color: var(--red-deep);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── iframe do Apps Script ── */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--beige);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #app-frame.ready { opacity: 1; }

    /* ── Splash de carregamento ── */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background:
        radial-gradient(circle at 20% 30%, rgba(244, 166, 35, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(46, 74, 130, 0.30) 0%, transparent 45%),
        linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
      color: var(--cream);
      text-align: center;
      padding: 1.5rem;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(255, 248, 234, 0.10);
      border: 2px solid var(--yellow);
      padding: 14px;
      object-fit: contain;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .splash-title {
      font-family: 'Amatic SC', cursive;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3rem);
      color: var(--yellow);
      letter-spacing: 2px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      line-height: 1;
    }
    .splash-sub {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--yellow-soft);
      opacity: 0.95;
    }
    .splash-dots {
      display: inline-flex;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }
    .splash-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--yellow);
      opacity: 0.35;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.25); }
    }

    /* ── Erro de configuração ── */
    #error-box {
      display: none;
      max-width: 520px;
      background: var(--cream);
      color: var(--red-deep);
      border: 2px dashed var(--yellow);
      border-radius: 14px;
      padding: 1.5rem 1.5rem 1.2rem;
      text-align: left;
      line-height: 1.55;
    }
    #error-box h2 {
      font-family: 'Amatic SC', cursive;
      font-size: 1.8rem;
      color: var(--red);
      margin-bottom: 0.4rem;
    }
    #error-box code {
      display: inline-block;
      background: rgba(46, 74, 130, 0.08);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Splash exibido até o iframe carregar -->
  <div id="splash" role="status" aria-live="polite">
    <img class="splash-logo" src="images/logo-paroquia.png" alt="Paróquia N. S. Conceição Aparecida"
         onerror="this.style.display='none'">
    <div class="splash-title">Feijotacê</div>
    <div class="splash-sub">— preparando a festa…</div>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="error-box">
      <h2>Configuração pendente</h2>
      <p>
        Edite <code>docs/index.html</code> e preencha a constante
        <code>APPS_SCRIPT_URL</code> com a URL <code>/exec</code> do Web App
        publicado no Google Apps Script.
      </p>
    </div>
  </div>

  <!-- iframe do Web App publicado no Apps Script -->
  <iframe id="app-frame"
          title="Feijotacê — Patrocínio"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write"></iframe>

  <script>
    (function () {
      // ⚠️ EDITE AQUI depois de publicar o Web App:
      //    Arquivo > Projetos de implantação > Novo > Tipo: Web app
      //    Copie a "URL da Web app" (termina em /exec) e cole abaixo.
      var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4sWwDk5fCIyzSCEFRWzs-LjjzThMQL7wXWh47SZ3Th6NqxGNU9v6W69Bhfw7BV-XV/exec';

      var frame  = document.getElementById('app-frame');
      var splash = document.getElementById('splash');
      var errBox = document.getElementById('error-box');

      var isPlaceholder = /XXXXXXXXXXXX/.test(APPS_SCRIPT_URL) ||
                          !/\/macros\/s\/[^/]+\/exec/.test(APPS_SCRIPT_URL);

      if (isPlaceholder) {
        errBox.style.display = 'block';
        return; // fica no splash com a mensagem de configuração
      }

      // Preserva querystring (ex.: ?cota=ouro) ao redirecionar para o iframe
      var qs = window.location.search || '';
      frame.src = APPS_SCRIPT_URL + qs;

      frame.addEventListener('load', function () {
        frame.classList.add('ready');
        splash.classList.add('hidden');
      });

      // Failsafe: se o iframe não disparar onload em 12s, some com o splash
      setTimeout(function () {
        if (!frame.classList.contains('ready')) {
          frame.classList.add('ready');
          splash.classList.add('hidden');
        }
      }, 12000);

      // ── Navegação via postMessage ──
      // O iframe (Apps Script) manda { type: 'navigate', qs: 'page=obrigado&cota=prata' }
      // para redirecionar sem sair do domínio custom.
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'navigate' || typeof data.qs !== 'string') return;
        var newQs = data.qs ? ('?' + data.qs.replace(/^[?&]/, '')) : '';
        frame.src = APPS_SCRIPT_URL + newQs;
        try {
          history.replaceState(null, '', '/' + newQs);
        } catch (e) { /* ignora se cross-origin bloquear */ }
      });
    })();
  </script>
</body>
</html>
