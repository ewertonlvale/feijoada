  <link rel="stylesheet" href="shell.css">

  <!-- Google Analytics 4 — propriedade G-Y48R7FT7NE.
       Carregado só nos shells (GitHub Pages) — a iframe do Apps Script
       NÃO recebe o snippet pra evitar duplicar page views. Como a navegação
       entre páginas usa target="_top" e recarrega o shell, todo page view
       da URL bar é capturado naturalmente. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y48R7FT7NE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Y48R7FT7NE');
  </script>
</head>
<body>

  <!-- Splash exibido até o iframe carregar -->
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-title">Feijotacê</div>
    <div class="splash-sub">— preparando a festa…</div>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="error-box">
      <h2>Configuração pendente</h2>
      <p>
        Edite <code>docs/shell.js</code> e preencha a constante
        <code>APPS_SCRIPT_URL</code> com a URL <code>/exec</code> do Web App
        publicado no Google Apps Script.
      </p>
    </div>
  </div>

  <!-- iframe do Web App publicado no Apps Script -->
  <iframe id="app-frame"
          title="Feijotacê — Patrocínio"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write"></iframe>

  <script src="shell.js" data-page="patrocinadores"></script>
</body>
</html>
