<!--
  cardapio_shell.html — SHELL DO GITHUB PAGES (NÃO É TEMPLATE DO APPS SCRIPT)

  Este arquivo deve ser servido pelo GitHub Pages como /cardapio.html no
  domínio custom (https://feijoada-familias.pnscaparecida.com/cardapio.html).
  É praticamente idêntico ao docs/index.html — a única diferença é que
  injeta `page=cardapio` no querystring antes de carregar o iframe do
  Apps Script.

  COMO USAR:
    1. Copie este arquivo para o seu repo do GitHub Pages
       (provavelmente para docs/cardapio.html, junto com index.html,
       lista.html, inscricao.html e obrigado.html).
    2. Renomeie para cardapio.html (sem o sufixo _shell).
    3. Commit + push — o GitHub Pages publica automaticamente.

  Se ainda não tiver shells separados para lista/inscricao/obrigado, esse
  é o momento de criar — siga este mesmo padrão (cada um injeta seu próprio
  page=...) e aponte para a URL /<rota>.html.

  IMPORTANTE: este arquivo NÃO precisa ser pushado para o Apps Script.
  O clasp empurra ele junto, mas Apps Script não serve — fica como peso
  morto inofensivo. Se quiser, adicione "cardapio_shell.html" ao
  .claspignore para não subir.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B2E2E">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Cardápio da Feijoada das Famílias 2026 — pratos, bebidas e doces.">

  <title>Cardápio · Feijoada das Famílias 2026</title>

  <link rel="icon" type="image/png" href="images/logo-paroquia.png">
  <link rel="apple-touch-icon" href="images/logo-paroquia.png">
  <link rel="manifest" href="manifest.json">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Cardápio · Feijoada das Famílias 2026">
  <meta property="og:description" content="O que vai ter na quadra: feijoada, espetinho, bebidas e sobremesas.">
  <meta property="og:image" content="images/panela-feijoada.png">
  <meta property="og:url" content="https://feijoada-familias.pnscaparecida.com/cardapio.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --red:        #8B2E2E;
      --red-deep:   #5A1616;
      --yellow:     #E8B84E;
      --yellow-soft:#F4D06F;
      --beige:      #F5E6D3;
      --cream:      #FFF8EA;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--beige);
      color: var(--red-deep);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app-frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: var(--beige);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #app-frame.ready { opacity: 1; }

    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      background:
        radial-gradient(circle at 20% 30%, rgba(232, 184, 78, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(91, 22, 22, 0.30) 0%, transparent 45%),
        linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
      color: var(--cream); text-align: center; padding: 1.5rem;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(255, 248, 234, 0.10);
      border: 2px solid var(--yellow);
      padding: 14px; object-fit: contain;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .splash-title {
      font-family: 'Amatic SC', cursive; font-weight: 700;
      font-size: clamp(2rem, 7vw, 3rem);
      color: var(--yellow); letter-spacing: 2px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      line-height: 1;
    }
    .splash-sub {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--yellow-soft);
      opacity: 0.95;
    }
    .splash-dots { display: inline-flex; gap: 0.45rem; margin-top: 0.5rem; }
    .splash-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--yellow);
      opacity: 0.35;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.25); }
    }
  </style>
</head>
<body>

  <div id="splash" role="status" aria-live="polite">
    <img class="splash-logo" src="images/logo-paroquia.png" alt="Paróquia N. S. Conceição Aparecida"
         onerror="this.style.display='none'">
    <div class="splash-title">Cardápio</div>
    <div class="splash-sub">— preparando a panela…</div>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>

  <iframe id="app-frame"
          title="Cardápio — Feijoada das Famílias"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write"></iframe>

  <script>
    (function () {
      // Mesma URL usada nos demais shells. Trocar aqui se republicar
      // o Apps Script com novo deploy ID.
      var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4sWwDk5fCIyzSCEFRWzs-LjjzThMQL7wXWh47SZ3Th6NqxGNU9v6W69Bhfw7BV-XV/exec';

      var frame  = document.getElementById('app-frame');
      var splash = document.getElementById('splash');

      // Injeta page=cardapio se ainda não veio na URL — preserva
      // outros params (ex.: ?cota=ouro) mesmo improváveis nesta página.
      var qs = window.location.search || '';
      if (!/[?&]page=/.test(qs)) {
        qs = qs ? (qs + '&page=cardapio') : '?page=cardapio';
      }
      frame.src = APPS_SCRIPT_URL + qs;

      frame.addEventListener('load', function () {
        frame.classList.add('ready');
        splash.classList.add('hidden');
      });

      setTimeout(function () {
        if (!frame.classList.contains('ready')) {
          frame.classList.add('ready');
          splash.classList.add('hidden');
        }
      }, 12000);

      // Mesmo handler de navegação dos outros shells — permite o iframe
      // pedir mudança de rota via postMessage.
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'navigate' || typeof data.qs !== 'string') return;
        var newQs = data.qs ? ('?' + data.qs.replace(/^[?&]/, '')) : '';
        frame.src = APPS_SCRIPT_URL + newQs;
        try { history.replaceState(null, '', '/cardapio.html' + newQs); }
        catch (e) { /* ignora cross-origin */ }
      });
    })();
  </script>
</body>
</html>
