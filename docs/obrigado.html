<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B2E2E">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Obrigado pelo apoio à Feijoada das Famílias 2026!">

  <title>Obrigado! · Feijoada das Famílias 2026</title>

  <!-- Favicon / PWA -->
  <link rel="icon" type="image/png" href="images/logo-paroquia.png">
  <link rel="apple-touch-icon" href="images/logo-paroquia.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Obrigado! — Feijoada das Famílias 2026">
  <meta property="og:description" content="Recebemos sua inscrição como patrocinador. Em breve entraremos em contato.">
  <meta property="og:image" content="images/panela-feijoada.png">
  <meta property="og:url" content="https://feijoada-familias.pnscaparecida.com/obrigado.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="shell.css">
</head>
<body>

  <!-- Splash exibido até o iframe carregar -->
  <div id="splash" role="status" aria-live="polite">
    <img class="splash-logo" src="images/dancando-feijoes.png" alt=""
         onerror="this.style.display='none'">
    <div class="splash-title">Feijoada das Famílias</div>
    <div class="splash-sub">— registrando seu apoio…</div>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="error-box">
      <h2>Configuração pendente</h2>
      <p>
        Edite <code>docs/shell.js</code> e preencha a constante
        <code>APPS_SCRIPT_URL</code> com a URL <code>/exec</code> do Web App
        publicado no Google Apps Script.
      </p>
    </div>
  </div>

  <!-- iframe do Web App publicado no Apps Script -->
  <iframe id="app-frame"
          title="Feijoada das Famílias — Obrigado pelo apoio"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write"></iframe>

  <script src="shell.js" data-page="obrigado"></script>
</body>
</html>
