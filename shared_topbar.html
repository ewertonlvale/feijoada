<!--
  shared_topbar.html — topbar reutilizável.
  Contexto obrigatório: currentPage, img.

  Uso (em pseudo — NÃO usar tags de scriptlet dentro deste comentário):
    include('shared_topbar', { currentPage: currentPage, img: img })

  ATENÇÃO: NÃO escreva scriptlets Apps Script (abre-interrog-excl-igual ...
  fecha-interrog) dentro de comentários HTML — o parser os executa mesmo
  entre comentários, causando recursão infinita.

  Obs.: a função siteUrl() é resolvida globalmente pelos scriptlets (V8),
  por isso NÃO é passada no contexto — passar uma function como propriedade
  de template pode travar o HtmlTemplate.

  Navegação:
    Os links apontam para URLs absolutas no custom domain (siteUrl) com
    target="_top", forçando o browser a sair do iframe e carregar o shell
    correspondente (docs/index.html, lista.html, inscricao.html,
    obrigado.html), que por sua vez embute o Apps Script com ?page=...
-->
<style>
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top);
    z-index: 500;
    background: rgba(46, 74, 130, 0.96);
    backdrop-filter: blur(8px);
    color: var(--cream);
    padding: 0.85rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    border-bottom: var(--border-thick) solid var(--yellow);
  }
  /* Usuários com "reduzir transparência" — sem blur caro. */
  @media (prefers-reduced-transparency: reduce) {
    .topbar {
      background: var(--red);
      backdrop-filter: none;
    }
  }

  .topbar-left, .topbar-right {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .topbar .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    color: var(--yellow);
    text-decoration: none;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .topbar .brand-logo {
    width: 28px; height: 28px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .topbar a.nav-link {
    color: var(--cream);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.88rem;
    padding: 0.4rem 0.9rem;
    border-radius: var(--radius-pill);
    background: rgba(255,248,234,0.08);
    border: var(--border-thin) solid rgba(255,248,234,0.18);
    transition: background var(--t-base) var(--ease-out);
  }
  @media (hover: hover) {
    .topbar a.nav-link:hover { background: rgba(255,248,234,0.18); }
    .topbar a.nav-link.active:hover { background: var(--yellow-soft); }
  }
  .topbar a.nav-link.active {
    background: var(--yellow);
    color: var(--red-deep);
    border-color: var(--yellow);
  }
  /* Foco visível (a11y) — independente de hover. */
  .topbar a.nav-link:focus-visible,
  .topbar .brand:focus-visible {
    outline: 2px solid var(--yellow-soft);
    outline-offset: 2px;
  }

  @media (max-width: 680px) {
    .topbar { padding: 0.7rem 0.9rem; flex-wrap: wrap; }
    .topbar .brand { font-size: 1.35rem; }
    .topbar a.nav-link { font-size: 0.8rem; padding: 0.35rem 0.7rem; }
  }
  /* Em telas mais estreitas (<420px), os 3 links + brand não cabem
     na mesma linha sem comprimir demais. flex-wrap já permite quebrar,
     e aqui reduzimos um pouco mais o gap pra não estourar. */
  @media (max-width: 420px) {
    .topbar { gap: 0.5rem; }
    .topbar-right { gap: 0.35rem; }
    .topbar a.nav-link { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
  }
</style>

<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="<?= siteUrl('patrocinadores') ?>" target="_top">
      <? if (img && img.logo) { ?>
        <picture>
          <? if (img.logoWebp) { ?>
            <source srcset="<?= img.logoWebp ?>" type="image/webp">
          <? } ?>
          <img class="brand-logo"
               src="<?= img.logo ?>"
               alt="Paróquia N. S. Conceição Aparecida"
               width="28" height="28">
        </picture>
      <? } ?>
      <span>Feijotacê</span>
    </a>
  </div>
  <nav class="topbar-right" aria-label="Navegação principal">
    <a class="nav-link <?= currentPage === 'patrocinadores' ? 'active' : '' ?>"
       href="<?= siteUrl('patrocinadores') ?>" target="_top">Início</a>
    <a class="nav-link <?= currentPage === 'lista' ? 'active' : '' ?>"
       href="<?= siteUrl('lista') ?>" target="_top">Patrocinadores</a>
    <a class="nav-link <?= (currentPage === 'inscricao' || currentPage === 'obrigado') ? 'active' : '' ?>"
       href="<?= siteUrl('inscricao') ?>" target="_top">Quero Apoiar</a>
    <a class="nav-link <?= currentPage === 'cardapio' ? 'active' : '' ?>"
       href="<?= siteUrl('cardapio') ?>" target="_top">Cardápio</a>
  </nav>
</header>
