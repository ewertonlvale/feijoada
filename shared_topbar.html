<!-- shared_topbar.html — topbar reutilizável.
     Requer que o template tenha definido: scriptUrl, currentPage.
     Uso: <?!= include('shared_topbar') ?>
-->
<style>
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top);
    z-index: 500;
    background: rgba(139, 46, 46, 0.96);
    backdrop-filter: blur(8px);
    color: var(--cream);
    padding: 0.85rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    border-bottom: 2px solid var(--yellow);
  }
  .topbar-left, .topbar-right {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .topbar .brand {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 1.2px;
    color: var(--yellow);
    text-decoration: none;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .topbar .brand-logo {
    width: 28px; height: 28px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .topbar a.nav-link {
    color: var(--cream);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.88rem;
    padding: 0.4rem 0.9rem;
    border-radius: 50px;
    background: rgba(255,248,234,0.08);
    border: 1px solid rgba(255,248,234,0.18);
    transition: all 0.2s ease;
  }
  .topbar a.nav-link:hover {
    background: rgba(255,248,234,0.18);
  }
  .topbar a.nav-link.active {
    background: var(--yellow);
    color: var(--red-deep);
    border-color: var(--yellow);
  }
  .topbar a.nav-link.active:hover {
    background: var(--yellow-soft);
  }

  @media (max-width: 680px) {
    .topbar { padding: 0.7rem 0.9rem; flex-wrap: wrap; }
    .topbar .brand { font-size: 1.35rem; }
    .topbar a.nav-link { font-size: 0.8rem; padding: 0.35rem 0.7rem; }
  }
</style>

<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="<?= scriptUrl ?>?page=patrocinadores">
      <? if (img && img.logo) { ?>
        <img class="brand-logo" src="<?= img.logo ?>" alt="Paróquia N. S. Conceição Aparecida">
      <? } ?>
      <span>Feijoada das Famílias</span>
    </a>
  </div>
  <nav class="topbar-right">
    <a class="nav-link <?= currentPage === 'patrocinadores' ? 'active' : '' ?>"
       href="<?= scriptUrl ?>?page=patrocinadores">Cotas</a>
    <a class="nav-link <?= currentPage === 'lista' ? 'active' : '' ?>"
       href="<?= scriptUrl ?>?page=lista">Patrocinadores</a>
  </nav>
</header>
