<!--
  shared_styles.html — paleta + tokens + base reutilizável em todas as páginas.

  Filosofia: esse arquivo define o design system inteiro (cores, tipografia,
  espessuras, raios, durações, sombras) em custom properties no :root, e
  aplica os resets + estilos de footer/splash compartilhados. Todos os
  templates consomem isso via include('shared_styles').

  ATENÇÃO: NÃO escreva scriptlets Apps Script ( abre-interrog-excl-igual ...
  fecha-interrog ) dentro de comentários — o parser os executa mesmo entre
  HTML comments, causando recursão infinita.

  Se um valor aparece em mais de um arquivo, ele PROVAVELMENTE deveria estar
  aqui como token. Puxar para cá primeiro, usar var() depois.
-->
<style>
  :root {
    /* ──────────── Paleta feijoada ──────────── */
    --red:          #8B2E2E;
    --red-dark:     #6B1F1F;
    --red-deep:     #5A1616;
    --red-light:    #A8413B;
    --brown:        #6B3E2E;
    --brown-light:  #8B5E3E;
    --brown-soft:   #A67C5B;
    --beige:        #F5E6D3;
    --beige-light:  #FBF3E5;
    --beige-dark:   #E8D4B8;
    --cream:        #FFF8EA;
    --yellow:       #E8B84E;
    --yellow-dark:  #C89938;
    --yellow-soft:  #F4D06F;
    --green-leaf:   #4C6A3A;
    --green-dark:   #3D5530;
    --text-dark:    #2B1A12;
    --text-mid:     #5C4A3E;
    --text-light:   #8C7A6E;
    --whatsapp:     #25D366;

    /* Cotas */
    --bronze:       #B87333;
    --bronze-dark:  #8F571F;
    --prata:        #9B9B9B;
    --prata-dark:   #6F6F6F;
    --prata-darker: #505050;
    --ouro:         #D4A63B;
    --ouro-dark:    #A67C12;
    --ouro-darker:  #8A6510;

    /* Feedback */
    --error-bg:     #FCE4E4;
    --error-border: #E8B4B4;
    --error-text:   #8A1F1F;

    /* ──────────── Escala de raios ──────────── */
    --radius-xs:   6px;
    --radius-sm:  10px;
    --radius-md:  12px;
    --radius-lg:  14px;
    --radius-pill: 9999px;

    /* Alias histórico — ainda usado por .form-card, .ty-card, state-box */
    --radius: var(--radius-lg);

    /* ──────────── Bordas ──────────── */
    --border-thin:   1px;
    --border-md:    1.5px;
    --border-thick: 2px;

    /* ──────────── Transições ──────────── */
    --t-fast:  120ms;
    --t-base:  200ms;
    --t-slow:  320ms;
    --ease-out: cubic-bezier(0.2, 0, 0, 1);

    /* ──────────── Sombras ──────────── */
    --shadow-soft:  0 4px 18px rgba(91, 31, 31, 0.10);
    --shadow-hover: 0 10px 36px rgba(91, 31, 31, 0.18);
    --shadow-card:  0 6px 22px rgba(107, 62, 46, 0.14);

    /* ──────────── Tipografia ──────────── */
    --font-body:    'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-serif:   'Playfair Display', serif;
    --font-script:  'Caveat', cursive;
    --font-display: 'Amatic SC', cursive;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* Opt-out do Auto Dark Mode do Chrome/Edge — paleta feijoada é intencional. */
  :root { color-scheme: light; }

  html, body {
    font-family: var(--font-body);
    background:
      radial-gradient(circle at 10% 0%,  rgba(232, 184, 78, 0.10) 0%, transparent 35%),
      radial-gradient(circle at 90% 10%, rgba(139, 46, 46, 0.08) 0%, transparent 40%),
      var(--beige);
    color: var(--text-dark);
    min-height: 100vh;
    line-height: 1.6;
    padding-top:    env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  a { color: var(--red-dark); }

  /* Utilitário sr-only canônico — oculta visualmente mas preserva a11y. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Faixa de bandeirinhas — separador decorativo */
  .banner-faixa {
    height: 28px;
    background:
      repeating-linear-gradient(135deg,
        var(--yellow)       0,    var(--yellow)       14px,
        var(--red)          14px, var(--red)          28px,
        var(--brown-light)  28px, var(--brown-light)  42px,
        var(--beige-light)  42px, var(--beige-light)  56px);
    opacity: 0.85;
  }

  /* Footer paroquial — usado em todas as páginas via shared_footer. */
  .parish-footer {
    background: var(--red-deep);
    color: var(--cream);
    padding: 2.2rem 1.5rem calc(2.2rem + env(safe-area-inset-bottom));
    text-align: center;
    margin-top: 3rem;
    border-top: 4px solid var(--yellow);
  }
  .parish-footer img.parish-logo {
    width: 160px;
    height: 160px;
    max-width: 60vw;       /* não estoura em telas muito estreitas */
    object-fit: contain;
    margin: 0 auto 1.1rem;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
  }
  .parish-footer .parish-name {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .parish-footer .parish-sub {
    font-size: 0.85rem;
    opacity: 0.75;
    margin-bottom: 1rem;
  }
  .parish-footer .hashtag {
    font-family: var(--font-script);
    font-size: 1.4rem;
    color: var(--yellow);
  }

  /* ─────────────────────────────────────────────────
     Acessibilidade: respeitar preferências do SO.
     Reduced motion → desliga animações/transições.
     Reduced transparency → remove backdrop-filter etc.
     ───────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
