<!--
  shared_icons.html — biblioteca de SVGs reutilizáveis.

  Inclua uma vez no body de cada página que use ícones. Em pseudo (NÃO usar
  tags de scriptlet dentro deste comentário — o Apps Script as executa
  mesmo em comentários HTML, causando recursão):
    include('shared_icons')

  Uso depois:
    svg class="icon" aria-hidden="true" use href="#icon-whatsapp"
    svg class="icon" aria-hidden="true" use href="#icon-check"
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
  <!-- WhatsApp glyph — usado em CTAs de contato. -->
  <symbol id="icon-whatsapp" viewBox="0 0 24 24">
    <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
  </symbol>

  <!-- Check — usado nos benefícios de cada cota. -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
          d="M5 13l4 4L19 7"/>
  </symbol>

  <!-- Calendário — hero info chip. -->
  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8"  y1="2" x2="8"  y2="6"/>
      <line x1="3"  y1="10" x2="21" y2="10"/>
    </g>
  </symbol>

  <!-- Relógio — hero info chip. -->
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </g>
  </symbol>

  <!-- Pin de localização — hero info chip e botão "Endereço" do patrocinador. -->
  <symbol id="icon-pin" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </g>
  </symbol>

  <!-- Instagram — botão de contato do patrocinador. -->
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="0.7" fill="currentColor"/>
    </g>
  </symbol>
</svg>
